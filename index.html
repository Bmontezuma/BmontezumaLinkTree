<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brandon Montezuma | Elemental</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    body {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #000, #111);
      color: #fff;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      margin: 2rem auto 1rem;
      font-size: 2.5rem;
      letter-spacing: 3px;
      z-index: 10;
      position: relative;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin-top: 1rem;
      z-index: 10;
      position: relative;
    }

    .element-link {
      display: block;
      width: 280px;
      padding: 1.2rem;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      transition: all 0.4s ease;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      position: relative;
    }

    /* 🔥 Fire */
    .fire {
      background: #2b0000;
      color: #ff6600;
    }
    .fire:hover {
      background: #5a0000;
      box-shadow: 0 0 25px 10px rgba(255, 80, 0, 0.9);
      animation: flame 0.8s infinite alternate;
    }

    @keyframes flame {
      0% { transform: scale(1) rotate(-1deg); }
      100% { transform: scale(1.05) rotate(1deg); }
    }

    /* 🌊 Water */
    .water {
      background: #001f33;
      color: #00ccff;
    }
    .water:hover {
      background: #003f5c;
      box-shadow: 0 0 30px 10px rgba(0, 200, 255, 0.9);
      animation: ripple 0.6s ease-in-out infinite alternate;
    }

    @keyframes ripple {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    /* 🌪 Wind */
    .wind {
      background: #1a1a1a;
      color: #d3d3ff;
    }
    .wind:hover {
      background: #333;
      box-shadow: 0 0 25px 10px rgba(200, 200, 255, 0.9);
      animation: drift 0.5s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0% { transform: translateX(-2px); }
      100% { transform: translateX(2px); }
    }

    /* 🌱 Earth */
    .earth {
      background: #002b00;
      color: #00ff88;
    }
    .earth:hover {
      background: #004d00;
      box-shadow: 0 0 25px 10px rgba(0, 255, 150, 0.9);
      animation: grow 0.6s ease-in-out infinite alternate;
    }

    @keyframes grow {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* ✨ Ambient particle effect */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('https://www.transparenttextures.com/patterns/stardust.png');
      opacity: 0.03;
      z-index: 0;
      pointer-events: none;
    }

    /* For mobile spacing */
    @media (max-width: 480px) {
      .element-link {
        width: 90%;
      }
    }
  </style>
</head>
