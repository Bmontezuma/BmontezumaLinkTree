<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Capstone | Brandon Montezuma & Collin Ballard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    body {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
      background-size: 40px 40px;
      animation: pulsebg 4s linear infinite;
      color: #fff;
      overflow-x: hidden;
    }

    @keyframes pulsebg {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    h1 {
      text-align: center;
      margin: 3rem auto 1rem;
      font-size: 2rem;
      letter-spacing: 2px;
      position: relative;
      z-index: 10;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 3rem;
      z-index: 10;
      position: relative;
    }

    .element-link {
      display: block;
      width: 300px;
      padding: 1rem;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-size: 1.1rem;
      transition: all 0.4s ease;
      border: 2px solid #fff2;
      font-weight: bold;
      letter-spacing: 2px;
      position: relative;
      z-index: 10;
    }

    .element-link::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: inherit;
      opacity: 0.1;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: -1;
    }

    /* Themed styles */
    .containment {
      background: #222200;
      color: #ffcc00;
    }
    .containment:hover {
      box-shadow: 0 0 20px 5px #ffcc00aa;
      transform: scale(1.05) rotate(1deg);
    }

    .neural {
      background: #1a002a;
      color: #cc66ff;
    }
    .neural:hover {
      box-shadow: 0 0 25px 7px #cc66ffaa;
      transform: scale(1.05);
    }

    .mutation {
      background: #002a00;
      color: #66ff66;
    }
    .mutation:hover {
      box-shadow: 0 0 20px 6px #66ff66aa;
      transform: scale(1.05);
    }

    .overcharge {
      background: #001a2a;
      color: #66ccff;
    }
    .overcharge:hover {
      box-shadow: 0 0 25px 7px #66ccffaa;
      transform: scale(1.05) rotate(-1deg);
    }

    /* For mobile spacing */
    @media (max-width: 480px) {
      .element-link {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <h1>🧟‍♂️ Brandon Montezuma — Developer</h1>
  <div class="container">
    <a class="element-link containment" href="https://github.com/Bmontezuma" target="_blank">☣️ Containment (GitHub)</a>
    <a class="element-link neural" href="https://www.linkedin.com/in/brandon-montezuma/" target="_blank">🧠 Neural Link (LinkedIn)</a>
    <a class="element-link overcharge" href="https://www.artstation.com/brandonmontezuma6" target="_blank">🔋 Overcharge (Portfolio)</a>
    <a class="element-link mutation" href="https://brandonmontezuma.wixsite.com/brandon-montezuma-3" target="_blank">🧬 Mutation (Website)</a>
  </div>

  <h1>🔧 Collin Ballard — Team Lead</h1>
  <div class="container">
    <a class="element-link containment" href="https://github.com/Collinb190" target="_blank">☣️ Containment (GitHub)</a>
    <a class="element-link neural" href="https://www.linkedin.com/in/collin-ballard" target="_blank">🧠 Neural Link (LinkedIn)</a>
    <a class="element-link overcharge" href="https://www.linkwithlin.com/" target="_blank">🔋 Overcharge (Portfolio)</a>
  </div>

</body>
</html>
